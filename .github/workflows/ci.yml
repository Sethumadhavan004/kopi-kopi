name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest ruff==0.16.8
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -q
      - name: Windows self-test (draws and loads every cursor)
        if: runner.os == 'Windows'
        run: |
          pip install .
          kopi-kopi --self-test
      - name: Package builds
        run: |
          pip install build
          python -m build
